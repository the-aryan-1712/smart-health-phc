[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info

[program:fastapi]
command=python -m uvicorn backend.main:app --host 0.0.0.0 --port %(ENV_FASTAPI_PORT)s --workers 1
directory=/app
autorestart=true
startretries=5
startsecs=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app"

[program:nextjs]
directory=/app/frontend
command=node /app/frontend/server.js
environment=PORT="%(ENV_PORT)s",HOSTNAME="0.0.0.0",FASTAPI_INTERNAL_URL="http://localhost:%(ENV_FASTAPI_PORT)s",NODE_ENV="production"
autorestart=true
startretries=5
startsecs=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
